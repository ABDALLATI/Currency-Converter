<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header>
        <div class="logo-text">
            <span class="icon"><i class="fa-solid fa-left-right"></i></span>
            <h2 class="text">Currency Converter</h2>
        </div>
        <div class="thems">
            <button>
                <span class="them"><i class="fa-solid fa-moon"></i></span>
                Dark Mode
            </button>
        </div>
    </header>
    <div class="container">
        <div class="content">
            <div class="content-text">
                <h1>Currency Converter</h1>
                <p>Convert between different currencies with real-time exchange rates.</p>
            </div>
            <div class="content-inputs">
                <label for="current-value">Amount</label>
                <input type="number" class="current-value" step="any" placeholder="Enter amount" id="current-value" min="0">
                <div class="swap-con">
                    <div class="from">
                        <label for="sel-one">from</label>
                        <select name="from" id="sel-one">
                            
                        </select>
                    </div>
                    <span class="icon-convert"><i class="fa-solid fa-left-right"></i></span>
                    <div class="to">
                        <label for="sel-two">To</label>
                        <select name="to" id="sel-two">
                            
                        </select>
                    </div>

                </div>
                <button class="convert">Convert</button>
                <span class="result"></span>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>

</html>
